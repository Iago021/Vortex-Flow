<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vortex Flow" />
    <title>Entrar | Vortex Flow</title>
    <link rel="stylesheet" href="../estilos/principal.css" />
    <link rel="stylesheet" href="../estilos/responsivo.css" />
    <script src="../scripts/principal.js" defer></script>
  </head>
  <body class="pagina_login">
    <a class="voltar_link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>Voltar ao início</a>
    <a class="logo logo_canto" href="../index.html" aria-label="Vortex Flow - início"><span class="logo_simbolo" aria-hidden="true"></span></a>

    <main class="autenticacao_principal">
      <div class="conteiner">
        <header class="login_chamada">
          <h1>Pequenos comércios <strong>Grandes negócios</strong></h1>
        </header>

        <section class="login_cartao" aria-labelledby="titulo_login">
          <h2 id="titulo_login">Junte-se a nós!</h2>

          <form class="login_formulario" data-formulario data-sucesso="Os dados foram validados. O login real será conectado ao banco de dados em outra etapa.">
            <div class="campo">
              <label for="identificacao">E-mail ou telefone</label>
              <input id="identificacao" name="identificacao" type="text" autocomplete="username" placeholder="Digite seu e-mail ou número de telefone" required />
            </div>

            <div class="campo campo_senha">
              <label for="senha_login">Senha</label>
              <input id="senha_login" name="senha" type="password" autocomplete="current-password" minlength="8" placeholder="Digite sua senha" required data-senha />
              <button class="mostrar_senha" type="button" aria-pressed="false" data-mostrar-senha="#senha_login">Mostrar</button>
            </div>

            <div class="login_links"><a href="#" data-mensagem="A recuperação de senha será ativada junto da autenticação.">Esqueceu a senha?</a></div>
            <button class="botao botao_laranja" type="submit">Entrar</button>
          </form>

          <div class="separador">ou continue com</div>
          <div class="sociais" aria-label="Opções de login social">
            <button class="social social_google" type="button" aria-label="Entrar com Google" data-mensagem="O login com Google será integrado posteriormente.">G</button>
            <button class="social social_linkedin" type="button" aria-label="Entrar com LinkedIn" data-mensagem="O login com LinkedIn será integrado posteriormente.">in</button>
            <button class="social social_facebook" type="button" aria-label="Entrar com Facebook" data-mensagem="O login com Facebook será integrado posteriormente.">f</button>
          </div>

          <p class="login_cadastro">Ainda não possui uma conta? <a href="criar_conta.html">Cadastre-se</a></p>
        </section>
      </div>
    </main>
  </body>
</html>
