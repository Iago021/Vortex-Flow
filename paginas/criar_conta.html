<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crie uma conta no Vortex Flow." />
    <title>Criar conta | Vortex Flow</title>
    <link rel="stylesheet" href="../estilos/principal.css" />
    <link rel="stylesheet" href="../estilos/responsivo.css" />
    <script src="../scripts/principal.js" defer></script>
  </head>
  <body class="pagina_cadastro">
    <a class="voltar_link" href="login.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>Voltar ao login</a>
    <a class="logo logo_canto" href="../index.html" aria-label="Vortex Flow - início"><span class="logo_simbolo" aria-hidden="true"></span></a>

    <main class="cadastro_principal">
      <div class="conteiner">
        <h1 class="cadastro_titulo">Juntos,<br /><strong>vamos criar uma história!</strong></h1>

        <form class="cadastro_formulario" data-formulario data-sucesso="Cadastro validado. Os dados serão salvos quando o banco de dados for conectado.">
          <section class="cadastro_coluna" aria-labelledby="dados_pessoais">
            <h2 id="dados_pessoais">Seus dados</h2>
            <div class="campo"><label for="nome_completo">Nome completo</label><input id="nome_completo" name="nome_completo" type="text" autocomplete="name" placeholder="Digite seu nome completo" required /></div>
            <div class="campo"><label for="email_cadastro">E-mail</label><input id="email_cadastro" name="email" type="email" autocomplete="email" placeholder="Digite seu e-mail" required /></div>
            <div class="campo"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" autocomplete="tel" placeholder="(19) 99999-9999" required data-telefone /></div>
            <div class="campo"><label for="cidade">Cidade</label><input id="cidade" name="cidade" type="text" autocomplete="address-level2" placeholder="Digite sua cidade" required /></div>
            <div class="campo"><label for="estado">Estado</label><select id="estado" name="estado" autocomplete="address-level1" required><option value="">Selecione o estado</option><option value="SP">São Paulo</option><option value="MG">Minas Gerais</option><option value="RJ">Rio de Janeiro</option><option value="PR">Paraná</option><option value="SC">Santa Catarina</option><option value="RS">Rio Grande do Sul</option><option value="outro">Outro</option></select></div>
          </section>

          <section class="cadastro_coluna" aria-labelledby="dados_seguranca">
            <h2 id="dados_seguranca">Segurança</h2>
            <div class="campo campo_senha"><label for="senha_cadastro">Senha</label><input id="senha_cadastro" name="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required data-senha /><button class="mostrar_senha" type="button" aria-pressed="false" data-mostrar-senha="#senha_cadastro">Mostrar</button></div>
            <div class="campo campo_senha"><label for="confirmar_senha">Confirmar senha</label><input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" minlength="8" placeholder="Digite a senha novamente" required data-confirmar-senha /><button class="mostrar_senha" type="button" aria-pressed="false" data-mostrar-senha="#confirmar_senha">Mostrar</button></div>
            <div class="captcha"><label><input type="checkbox" name="verificacao" required /> Não sou um robô</label><small>Verificação visual<br />sem envio de dados</small></div>
          </section>

          <div class="cadastro_acao"><a href="login.html">Já tenho uma conta</a><button class="botao botao_laranja" type="submit">Criar conta</button></div>
        </form>
      </div>
    </main>
  </body>
</html>
