<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crie sua conta KemetForge."><title>Criar conta | KemetForge</title><link rel="icon" type="image/svg+xml" href="../imagens/logo_simbolo.svg?v=5"><link rel="stylesheet" href="../estilos/principal.css"><link rel="stylesheet" href="../estilos/responsivo.css"><link rel="stylesheet" href="../estilos/revisao.css"><script src="../scripts/principal.js" defer></script><script src="../scripts/revisao.js" defer></script></head>
<body><main class="autenticacao"><a class="logo-canto" href="../index.html"><img src="../imagens/logo_kemetforge.svg?v=5" alt="KemetForge"></a><a class="voltar" href="login.html">← Já tenho conta</a><div class="cadastro-wrap"><h1 class="cadastro-titulo">Juntos,<br><span>vamos criar uma história!</span></h1><form class="cadastro-form" data-formulario data-destino="painel.html"><section class="cartao cadastro-coluna"><div class="campo"><label for="nome">Nome completo</label><input id="nome" required autocomplete="name"></div><div class="campo"><label for="cad-email">E-mail</label><input id="cad-email" type="email" required autocomplete="email"></div><div class="campo"><label for="telefone">Telefone</label><input id="telefone" type="tel" required data-telefone autocomplete="tel"></div><div class="campo"><label for="negocio">Nome do negócio</label><input id="negocio" required></div></section><section class="cartao cadastro-coluna"><div class="campo"><label for="senha">Senha</label><div class="senha-wrap"><input id="senha" type="password" minlength="8" required data-senha><button class="mostrar-senha" type="button" data-mostrar-senha="#senha">Mostrar</button></div></div><div class="campo"><label for="confirmar">Confirmar senha</label><input id="confirmar" type="password" minlength="8" required data-confirmar-senha></div><div class="campo"><label for="categoria">Categoria do negócio</label><select id="categoria" required><option value="">Selecione</option><option>Padaria</option><option>Confeitaria</option><option>Cafeteria</option><option>Mercado</option><option>Outro</option></select></div><label><input type="checkbox" required> Aceito os termos de uso</label></section><div class="cadastro-acoes"><a href="login.html">Já possuo uma conta</a><button class="botao" type="submit">Criar conta</button></div></form></div></main></body></html>
